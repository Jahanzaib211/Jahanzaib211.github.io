<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Jahanzaib Ali</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpolygon points='16,3 28,10 28,22 16,29 4,22 4,10' fill='%2305060a' stroke='%2352f2c5' stroke-width='2'/%3E%3Cline x1='16' y1='3' x2='16' y2='29' stroke='%2352f2c5' stroke-width='1' opacity='0.6'/%3E%3Cline x1='4' y1='10' x2='28' y2='22' stroke='%2352f2c5' stroke-width='1' opacity='0.6'/%3E%3Cline x1='4' y1='22' x2='28' y2='10' stroke='%2352f2c5' stroke-width='1' opacity='0.6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #05060a;
    color: #eef1f6;
    font-family: "IBM Plex Mono", monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .box {
    max-width: 480px;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 6px;
    background: rgba(18, 22, 34, 0.55);
    padding: 32px;
  }
  .prompt { color: #52f2c5; font-size: 0.85rem; margin-bottom: 16px; }
  h1 {
    font-family: "Chakra Petch", sans-serif;
    font-size: 2.4rem;
    margin-bottom: 12px;
  }
  p { color: #8a93a6; font-size: 0.9rem; line-height: 1.6; margin-bottom: 24px; }
  a.btn {
    display: inline-block;
    color: #04140f;
    background: #52f2c5;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.85rem;
    padding: 12px 22px;
    border-radius: 4px;
  }
  a.btn:focus-visible { outline: 2px solid #52f2c5; outline-offset: 3px; }
</style>
</head>
<body>
  <main class="box">
    <div class="prompt">$ open <span id="path">/this-page</span><br>error: no such route</div>
    <h1>404</h1>
    <p>This coordinate doesn't exist in the system. The route may have moved, or it never shipped.</p>
    <a class="btn" href="/">Return to base &rarr;</a>
  </main>
  <script>
    document.getElementById('path').textContent = location.pathname;
  </script>
</body>
</html>
