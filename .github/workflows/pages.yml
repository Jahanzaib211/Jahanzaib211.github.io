name: Publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --no-fund --no-audit
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  # A separate job, so the uploaded site is listed before it is asked for
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
      - uses: actions/checkout@v7
      - name: Tell search engines about the new pages
        continue-on-error: true
        run: |
          urls=$(grep -oP '(?<=<loc>)[^<]+' public/sitemap.xml | sed 's/.*/"&"/' | paste -sd,)
          curl -fsS -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "{\"host\":\"alilabsx.com\",\"key\":\"$(cat indexnow.key)\",\"urlList\":[$urls]}"
