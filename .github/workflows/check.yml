name: Check site
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm run build
      - name: Generated pages are committed
        run: git diff --exit-code --stat -- ':!public/sitemap.xml'
      # A download that hangs is stopped and tried again
      - if: matrix.browser != 'chromium'
        run: for i in 1 2 3; do timeout -k 10 240 npx playwright-core install --with-deps ${{ matrix.browser }} && exit 0; done; exit 1
      - run: npm test
        env:
          BROWSER: ${{ matrix.browser }}
          SHARDS: 2
